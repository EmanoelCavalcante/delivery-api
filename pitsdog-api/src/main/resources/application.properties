spring.application.name=pitsdog-api

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=0

whatsapp.bot.api-key=${WHATSAPP_BOT_API_KEY:}

TEMPO_ENTREGA_MINIMO_MINUTOS=30
TEMPO_ENTREGA_MAXIMA_MINUTOS=60

# Rate limit - login administrativo
app.rate-limit.login.capacidade=5
app.rate-limit.login.periodo-minutos=10

# Rate limit - consultas publicas
app.rate-limit.consulta-publica.capacidade=3
app.rate-limit.consulta-publica.periodo-minutos=1

# Cache de buckets do rate limit
app.rate-limit.cache.expiracao-minutos=30
app.rate-limit.cache.maximo-registros=10000

# Proxy reverso do Railway
server.forward-headers-strategy=native