spring.application.name=pitsdog-api

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=0

app.pedido.taxa-entrega-padrao=${TAXA_ENTREGA_PADRAO:0}

app.pedido.tempo-entrega-minimo-minutos=${TEMPO_ENTREGA_MINIMO_MINUTOS:30}
app.pedido.tempo-entrega-maximo-minutos=${TEMPO_ENTREGA_MAXIMO_MINUTOS:60}


app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://pitsdog-site.netlify.app}
# Rate limit - login administrativo
app.rate-limit.login.capacidade=5
app.rate-limit.login.periodo-minutos=10

# Rate limit - consultas publicas
app.rate-limit.consulta-publica.capacidade=300
app.rate-limit.consulta-publica.periodo-minutos=1

# Rate limit - criacao publica de pedidos
app.rate-limit.pedido-publico.capacidade=10
app.rate-limit.pedido-publico.periodo-minutos=1

# Rate limit - rotas administrativas
app.rate-limit.admin.capacidade=120
app.rate-limit.admin.periodo-minutos=1

# Cache de buckets do rate limit
app.rate-limit.cache.expiracao-minutos=30
app.rate-limit.cache.maximo-registros=10000

# Proxy reverso do Railway
server.forward-headers-strategy=native
